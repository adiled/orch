[package]
name = "the-orch"
version = "0.2.6"
edition = "2024"
description = "Parser for Orchfiles — declarative, platform-agnostic service orchestration specifications. Parses, merges, resolves, and detects cycles in Orchfiles; outputs structured JSON."
license = "Apache-2.0"
repository = "https://github.com/adiled/orch"
include = [
    "src/**/*.rs",
    "tests/**/*.rs",
    "Cargo.toml",
    "LICENSE",
    "README.md",
]

[[bin]]
name = "orch"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
