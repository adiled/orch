[package]
name = "the-orch"
version = "0.2.10"
edition = "2024"
description = "Reference implementation of the Orchfile specification: merges, expands and validates Orchfiles, and prints the canonical Orchfile or JSON."
license = "Apache-2.0"
repository = "https://github.com/adiled/orch"
include = [
    "src/**/*.rs",
    "tests/**/*.rs",
    "Cargo.toml",
    "LICENSE",
    "README.md",
    "schema/*.json",
    "conformance/**",
]

[[bin]]
name = "orch"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
